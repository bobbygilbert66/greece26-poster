<div id=lb><span id=lbX>&times;</span><button class=b id=lbPrev>&#8249;</button>
<img alt=""><video controls playsinline></video><button class=b id=lbNext>&#8250;</button><span id=lbCap></span></div>
<script>
const lb=document.getElementById('lb'),im=lb.querySelector('img'),
vid=lb.querySelector('video'),cap=document.getElementById('lbCap');
const links=[...document.querySelectorAll('.grid a')];
let cur=0;
function show(i){cur=(i+links.length)%links.length;
const href=links[cur].dataset.src;
if(/\.(mp4|mov|m4v|webm|avi)(\?.*)?$/i.test(href)){
im.style.display='none';vid.style.display='block';vid.src=href;vid.play();
}else{vid.pause();vid.style.display='none';im.style.display='block';im.src=href;}
cap.textContent=(cur+1)+' / '+links.length;
lb.style.display='flex';zreset();}
links.forEach((a,i)=>a.addEventListener('click',e=>{e.preventDefault();show(i);}));
document.getElementById('lbPrev').onclick=e=>{e.stopPropagation();show(cur-1);};
document.getElementById('lbNext').onclick=e=>{e.stopPropagation();show(cur+1);};
document.getElementById('lbX').onclick=()=>{vid.pause();lb.style.display='none';};
let zmv=0;
lb.onclick=()=>{if(zmv>3){zmv=0;return;}vid.pause();lb.style.display='none';zreset();};
document.addEventListener('keydown',e=>{if(lb.style.display!=='flex')return;
if(e.key==='Escape'){vid.pause();lb.style.display='none';}
if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1);});
// zoom on the open image: wheel / pinch, drag to pan when zoomed
let zs=1,zx=0,zy=0;const zmax=6;
const zlay=()=>im.style.transform=`translate(${zx}px,${zy}px) scale(${zs})`;
function zreset(){zs=1;zx=0;zy=0;zlay();}
const iorig=()=>({x:im.offsetLeft,y:im.offsetTop});  // untransformed origin
im.addEventListener('wheel',e=>{e.preventDefault();
const lb_r=lb.getBoundingClientRect(),o=iorig(),
mx=e.clientX-lb_r.left-o.x,my=e.clientY-lb_r.top-o.y,
ns=Math.min(zmax,Math.max(1,zs*(e.deltaY<0?1.25:0.8)));
zx=mx-(mx-zx)*ns/zs;zy=my-(my-zy)*ns/zs;zs=ns;zlay();});
let zp=null,zpts=new Map(),zpin=null;
im.addEventListener('pointerdown',e=>{zpts.set(e.pointerId,{x:e.clientX,y:e.clientY});
zmv=0;
if(zpts.size===1&&zs>1)zp={x:e.clientX-zx,y:e.clientY-zy};e.preventDefault();});
im.addEventListener('pointermove',e=>{if(!zpts.has(e.pointerId))return;
zpts.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(zpts.size===2){zp=null;const[a,b]=[...zpts.values()];
const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
const lb_r=lb.getBoundingClientRect(),o=iorig(),
cx=mx-lb_r.left-o.x,cy=my-lb_r.top-o.y;
if(zpin){const ns=Math.min(zmax,Math.max(1,zs*d/zpin.d));
zx=cx-(cx-zx)*ns/zs-(cx-zpin.x);zy=cy-(cy-zy)*ns/zs-(cy-zpin.y);zs=ns;}
zpin={d,x:cx,y:cy};zlay();}
else if(zp){zx=e.clientX-zp.x;zy=e.clientY-zp.y;zlay();}
zmv++;});
const zup=e=>{zpts.delete(e.pointerId);if(zpts.size<2)zpin=null;
if(zpts.size===0)zp=null;else if(zs>1){const[p]=[...zpts.values()];zp={x:p.x-zx,y:p.y-zy};}};
im.addEventListener('pointerup',zup);im.addEventListener('pointercancel',zup);
im.addEventListener('dblclick',()=>{zs=1;zx=0;zy=0;zlay();});
im.addEventListener('click',e=>{if(zmv>3)e.preventDefault();e.stopPropagation();});
// swipe only when not zoomed (zoomed drags pan instead)
let sx=null;lb.addEventListener('touchstart',e=>{if(zpts.size<2)sx=e.touches[0].clientX;});
lb.addEventListener('touchend',e=>{if(sx===null||zs>1){sx=null;return;}
const dx=e.changedTouches[0].clientX-sx;
if(dx>50)show(cur-1);else if(dx<-50)show(cur+1);sx=null;});

document.addEventListener('contextmenu',e=>{
if(e.target.closest('.grid,#lb,#viewer'))e.preventDefault();});
document.addEventListener('dragstart',e=>{
if(e.target.closest('.grid,#lb'))e.preventDefault();});
// iOS ignores user-scalable=no — block pinch zoom except on the lb image
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{
if(e.touches.length>1&&!e.target.closest('#lb img,#viewer'))e.preventDefault();
},{passive:false});
</script>
