<script>
const v=document.getElementById('viewer'),l=document.getElementById('layer');
let s=1,tx=0,ty=0;const maxS=8;
function layout(){l.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;}
v.addEventListener('wheel',e=>{e.preventDefault();const r=v.getBoundingClientRect();
const mx=e.clientX-r.left,my=e.clientY-r.top,ns=Math.min(maxS,Math.max(1,s*(e.deltaY<0?1.25:0.8)));
tx=mx-(mx-tx)*ns/s;ty=my-(my-ty)*ns/s;s=ns;layout();});

else{const[p]=[...pts.values()];drag={x:p.x-tx,y:p.y-ty};}};
